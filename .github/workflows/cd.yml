name: Deploy Worker to EC2

on:
  push:
    branches: ["develop"]
    paths:
      - "service/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/moodotclone/moodotclone:${{ github.sha }} ./service
          docker tag $ECR_REGISTRY/moodotclone/moodotclone:${{ github.sha }} $ECR_REGISTRY/moodotclone/moodotclone:latest
          docker push $ECR_REGISTRY/moodotclone/moodotclone:${{ github.sha }}
          docker push $ECR_REGISTRY/moodotclone/moodotclone:latest

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="${ECR_REGISTRY}/moodotclone/moodotclone:latest"
          DEPLOY_CMD="aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${ECR_REGISTRY} && docker pull ${IMAGE} && docker rm -f moodot-worker 2>/dev/null; docker run -d --name moodot-worker --env-file /home/ubuntu/moodot_clone/service/.env.local --restart always ${IMAGE}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"${DEPLOY_CMD}\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text)

          ERROR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text)

          echo "=== Status: $STATUS ==="
          echo "=== Output ==="
          echo "$OUTPUT"
          if [ -n "$ERROR" ]; then
            echo "=== Error ==="
            echo "$ERROR"
          fi

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
